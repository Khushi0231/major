# ═══════════════════════════════════════════════
# DRAVIS Microservices Deployments (K8s)
# ═══════════════════════════════════════════════

# ─── Auth Service ──────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: dravis
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: dravis/auth:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: "mysql+pymysql://dravis:dravis_pass_2024@mysql:3306/dravis"
            - name: SERVICE_NAME
              value: auth
            - name: SERVICE_PORT
              value: "8001"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits:   { memory: "256Mi", cpu: "250m" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: dravis
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001

---
# ─── Chat Service ─────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: dravis
  labels:
    app: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: dravis/chat:latest
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              value: "mysql+pymysql://dravis:dravis_pass_2024@mysql:3306/dravis"
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"
            - name: OLLAMA_MODEL
              value: "llama3.1:8b"
            - name: DOCUMENT_SERVICE_URL
              value: "http://document:8003"
            - name: SERVICE_NAME
              value: chat
            - name: SERVICE_PORT
              value: "8002"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits:   { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: dravis
spec:
  selector:
    app: chat
  ports:
    - port: 8002
      targetPort: 8002

