# ─── DRAVIS Desktop App — Build & Release ──────────────────────────
# Triggers on pushing a version tag (v*) or manual dispatch.
# Builds:
#   1. Python backend → PyInstaller → dravis-bridge binary (per platform)
#   2. React frontend + Tauri → .exe (Windows), .dmg (macOS), .AppImage (Linux)
# Uploads all installers to a GitHub Release.

name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            ext: .exe
          - os: macos-latest
            target: macos
            ext: ''
          - os: ubuntu-22.04
            target: linux
            ext: ''

    runs-on: ${{ matrix.os }}
    name: Backend (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r services/chat/requirements.txt
          pip install -r services/auth/requirements.txt
          pip install -r services/document/requirements.txt
          pip install -r services/quiz/requirements.txt
          pip install httpx uvicorn[standard] fastapi

      - name: Install system deps (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Bundle backend with PyInstaller
        working-directory: services
        run: |
          pyinstaller --onefile --name dravis-bridge${{ matrix.ext }} \
            --hidden-import auth.app.main \
            --hidden-import chat.app.main \
            --hidden-import document.app.main \
            --hidden-import quiz.app.main \
            --hidden-import langchain_ollama \
            --hidden-import langchain_core \
            --hidden-import sentence_transformers \
            --hidden-import chromadb \
            --hidden-import uvicorn \
            --hidden-import httpx \
            --collect-all langchain_ollama \
            --collect-all sentence_transformers \
            desktop_bridge.py

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: dravis-bridge-${{ matrix.target }}
          path: services/dist/dravis-bridge${{ matrix.ext }}

  build-tauri:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            backend-artifact: dravis-bridge-windows
            sidecar-name: dravis-bridge.exe
          - os: macos-latest
            target: macos
            backend-artifact: dravis-bridge-macos
            sidecar-name: dravis-bridge
          - os: ubuntu-22.04
            target: linux
            backend-artifact: dravis-bridge-linux
            sidecar-name: dravis-bridge

    runs-on: ${{ matrix.os }}
    name: Tauri (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download backend sidecar
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.backend-artifact }}
          path: frontend/src-tauri/sidecars/

      - name: Make sidecar executable (Unix)
        if: matrix.target != 'windows'
        run: chmod +x frontend/src-tauri/sidecars/${{ matrix.sidecar-name }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          releaseName: 'DRAVIS ${{ github.ref_name || github.event.inputs.version }}'
          releaseBody: |
            ## DRAVIS Desktop App

            Download the installer for your platform:
            - **Windows**: `.exe` installer
            - **macOS**: `.dmg` disk image
            - **Linux**: `.AppImage` portable app

            ### First Launch
            1. Install [Ollama](https://ollama.com) if you haven't already
            2. Open DRAVIS — it will automatically download the AI model (~2 GB) on first run
            3. After that, DRAVIS works fully offline!
          releaseDraft: false
          prerelease: false
