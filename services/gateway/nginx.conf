# =============================================
# DRAVIS Gateway - Nginx Reverse Proxy
# Routes /api/{service}/* → internal microservice
# Serves React frontend at /
# =============================================

upstream auth_service {
    server auth:8001;
}

upstream chat_service {
    server chat:8002;
}

upstream document_service {
    server document:8003;
}

upstream quiz_service {
    server quiz:8004;
}

upstream speech_service {
    server speech:8005;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # ─── Logging ────────────────────────────────
    access_log /var/log/nginx/dravis_access.log;
    error_log  /var/log/nginx/dravis_error.log;

    # ─── Proxy defaults ────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # ─── Gateway Health ─────────────────────────
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # ─── Auth Service ───────────────────────────
    location /api/auth/ {
        proxy_pass         http://auth_service/;
        proxy_read_timeout 10s;
    }

    # ─── Chat Service ───────────────────────────
    location /api/chat/ {
        proxy_pass         http://chat_service/;
        proxy_read_timeout 120s;
    }

    # ─── Document Service ───────────────────────
    location /api/documents/ {
        proxy_pass         http://document_service/;
        proxy_read_timeout 120s;
    }

    # ─── Quiz Service ──────────────────────────
    location /api/quiz/ {
        proxy_pass         http://quiz_service/;
        proxy_read_timeout 120s;
    }

    # ─── Speech Service ─────────────────────────
    location /api/speech/ {
        proxy_pass         http://speech_service/;
        proxy_read_timeout 60s;
    }

    # ─── Frontend (React SPA) ──────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Error pages ───────────────────────────
    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable","code":503}';
    }
}
